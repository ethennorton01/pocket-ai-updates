name: Repository Baseline Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: repository-baseline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  baseline:
    name: PR Ready
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan changes for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/pr-secret-scan.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 2 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$work/scanner.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $work/scanner.tar.gz" | sha256sum --check --status
          tar -xzf "$work/scanner.tar.gz" -C "$work" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$work/config.toml"
          : > "$work/ignore"
          range="$HEAD_SHA"
          if [[ -n "$BASE_SHA" ]]; then range="$BASE_SHA..$HEAD_SHA"; fi
          if "$work/gitleaks" git . --log-opts="$range" \
            --config="$work/config.toml" --gitleaks-ignore-path="$work/ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --exit-code=1 \
            > "$work/scan.log" 2>&1; then
            echo 'Secret scan passed.'
          else
            echo '::error::Secret scan did not pass. Review findings privately.'
            exit 1
          fi
      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --check --format=oneline HEAD --
          fi
      - name: Verify release repository documentation
        run: test -s README.md